<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO-LIST</title>
    <link rel="stylesheet" href="To-Do-List.css">
    <link rel="stylesheet" href="Media.css">
    <script src="To-Do-List.js" defer></script>

</head>

<div class="todo-card">
    <h1>Simple TO-DO List</h1>
    <p class="subtitle">Welcome to your simple TO-DO List!<br>
    Double click to edit the todo</p>

    <!-- Input and button to add new todos -->
    <div class="input-container">
        <input type="text" id="todo-input" placeholder="Add a task..." aria-label="What needs to be done?">
        <button id="add-btn">Add Task</button>
    </div>

    <ul id="todo-list"></ul>



    <div id="bulk-delete-container" class="bulk-delete-hidden">
        <span id="selected-count">0 items selected</span>
        <button id="delete-selected-btn">Delete Selected</button>
    </div>
</div>


</html>
